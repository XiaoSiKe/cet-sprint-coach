name: Validate Skill

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uvx --from ruff==0.16.9 ruff check cet_sprint scripts tests
      - run: uvx --from ruff==0.16.9 ruff format --check cet_sprint scripts tests
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/validate_skill.py
